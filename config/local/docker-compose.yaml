services:
  nginx:
    image: 944708720531.dkr.ecr.eu-west-3.amazonaws.com/nginx:latest
    ports:
      - "80:80"
    links:
      - php
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ../..:/var/www/html
  php:
    container_name: php
    image: 944708720531.dkr.ecr.eu-west-3.amazonaws.com/php85:latest
    volumes:
      - ../..:/var/www/html
      - ~/.composer:/root/.composer
      - ./.gitconfig:/root/.gitconfig